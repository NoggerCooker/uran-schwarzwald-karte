<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- OSM benötigt einen normalen Referer; keine restriktive Referrer-Policy setzen. -->
  <title>Uranvorkommen im Schwarzwald – Übersichtskarte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    html, body { height:100%; margin:0; font:14px/1.4 system-ui, sans-serif; }
    #map { height:100%; width:100%; }
    .note { position:absolute; z-index:1000; top:10px; left:50px; max-width:330px;
      background:#fff; padding:10px 12px; border-radius:8px; box-shadow:0 1px 6px #777; }
    .note strong { display:block; margin-bottom:4px; }
  </style>
</head>
<body>
<div class="note">
  <strong>Uranvorkommen im Schwarzwald</strong>
  Übersicht historischer Fund- und Prospektionsgebiete. Marker zeigen Orts-/Gebietsmitten,
  keine verifizierten Stolleneingänge oder exakten Erzpunkte.
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
const map = L.map('map').setView([48.05, 8.05], 9);

// Offizieller OpenStreetMap-Tile-Endpunkt. Die Datei kann direkt per
// file:// im Browser geöffnet werden; kein lokaler Server erforderlich.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
  crossOrigin: true
}).addTo(map);

const places = [
  {name:'Grube Krunkelbach / Menzenschwand', lat:47.83, lon:8.07, type:'Hauptlagerstätte',
   desc:'Uranlagerstätte im Krunkelbachtal bei Menzenschwand. Marker nur ungefähr.'},
  {name:'Hummelsacker / Grube Müllenbach', lat:48.75, lon:8.23, type:'Prospektionsgebiet',
   desc:'Gebiet bei Oberbeuern/Baden-Baden; Punkt markiert die ungefähre Region.'},
  {name:'Wittichen', lat:48.34, lon:8.34, type:'Mineralisationen',
   desc:'Historisches Kobalt-Nickel-Wismut-Silber-Revier mit dokumentierten Uranmineralen.'},
  {name:'Reinerzau / Grube Dreikönigstern', lat:48.36, lon:8.42, type:'Historisches Revier',
   desc:'Ungefähre Lage des Reinerzauer Reviers.'},
  {name:'Schiltach / Grube Anton', lat:48.29, lon:8.34, type:'Historisches Revier',
   desc:'Ungefähre Ortslage; kein exakter Grubenpunkt.'},
  {name:'Weiler / Grube Michael', lat:48.28, lon:8.18, type:'Prospektionsgebiet',
   desc:'Gebietsmarker nach historischer Prospektionszuordnung; genaue Lage bitte fachlich prüfen.'},
  {name:'Schattenhöfen / Grube Otto', lat:48.23, lon:8.08, type:'Prospektionsgebiet',
   desc:'Gebietsmarker; genaue Lage nicht verifiziert.'},
  {name:'Eisenbach / Rappenloch', lat:47.96, lon:8.27, type:'Historisches Revier',
   desc:'Ungefähre Lage des genannten Gebiets.'},
  {name:'Sulzburg / Grube Gottes Segen', lat:47.84, lon:7.71, type:'Historisches Revier',
   desc:'Ortsmarker für das historische Bergbaurevier Sulzburg.'},
  {name:'Badenweiler / Grube Haus Baden', lat:47.80, lon:7.67, type:'Historisches Revier',
   desc:'Ortsmarker; kein bestätigter exakter Uranfundpunkt.'},
  {name:'Schönau / Sengalenkopf', lat:47.79, lon:7.90, type:'Uranhinweise',
   desc:'Gebietsmarker für die in Übersichten genannten Schiefer am Sengalenkopf.'},
  {name:'Menzenschwand-Vorderdorf', lat:47.82, lon:8.07, type:'Mineralfunde',
   desc:'Ortsmarker für gemeldete Mineralfunde; vom Krunkelbach-Vorkommen zu unterscheiden.'}
];

places.forEach(p => {
  const marker = L.marker([p.lat, p.lon]).addTo(map);
  marker.bindPopup(`<b>${p.name}</b><br><i>${p.type}</i><br>${p.desc}`);
});

const bounds = L.latLngBounds(places.map(p => [p.lat, p.lon]));
map.fitBounds(bounds.pad(0.12));
</script>
</body>
</html>
